# ==============================================================================
# Despliegue por PULL desde el Docker Registry de Nexus (sin 'build:' ni volumenes)
#   .env  ->  REGISTRY=<IP-PRIVADA-NEXUS>:8082   APP_VERSION=1.0.0
# Uso:  docker compose --env-file .env.registry -f docker-compose.registry.yml pull
#       docker compose --env-file .env.registry -f docker-compose.registry.yml up -d
# ==============================================================================
name: product

services:
  backend:
    image: ${REGISTRY}/ingesoft/product-api:${APP_VERSION}
    container_name: product-backend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - product-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/products || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    image: ${REGISTRY}/ingesoft/product-web:${APP_VERSION}
    container_name: product-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - product-network

networks:
  product-network:
    driver: bridge
